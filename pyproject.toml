[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atk-control"
version = "0.4.1"
description = "Native Linux configuration for ATK/VXE gaming mice (MAD R, VXE R1 and relatives)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ATK Control contributors" }]
keywords = ["mouse", "gaming", "hid", "gtk4", "libadwaita", "atk", "vxe", "mad-r", "r1"]
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
# GTK4, libadwaita, PyGObject, pycairo and dbus-python come from the distro.
dependencies = []

[project.scripts]
atk-control = "atk_control.app:main"
atkctl = "atk_control.cli:main"

[project.urls]
Homepage = "https://github.com/NasirA1991/atk-control"
Repository = "https://github.com/NasirA1991/atk-control"
Issues = "https://github.com/NasirA1991/atk-control/issues"
Documentation = "https://github.com/NasirA1991/atk-control#readme"

[tool.setuptools]
packages = ["atk_control"]
