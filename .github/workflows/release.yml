name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (for example v0.5.3)'
        required: true

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Check all version sources and tag
        id: version
        env:
          REF_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python3 scripts/check_versions.py --tag "$REF_NAME"
          echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build source tarball
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="atk-control-${VERSION}/" \
            -o "dist/atk-control-${VERSION}.tar.gz" HEAD
          SHA=$(sha256sum "dist/atk-control-${VERSION}.tar.gz" | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source
          path: dist/atk-control-*.tar.gz

  appimage:
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Build AppImage
        run: ./packaging/appimage/build.sh "${{ needs.source.outputs.version }}" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: dist/*.AppImage

  flatpak:
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub org.gnome.Platform//50 org.gnome.Sdk//50
      - name: Build Flatpak bundle
        run: ./packaging/flatpak/build.sh "${{ needs.source.outputs.version }}" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak
          path: dist/*.flatpak

  release:
    needs: [source, appimage, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: List release files and generate checksums
        run: |
          ls -lh dist
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true

  aur:
    needs: [release, source]
    if: vars.AUR_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Render stable PKGBUILD
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.source.outputs.version }}
          SHA256: ${{ needs.source.outputs.sha256 }}
        run: |
          sed -e "s|@REPO@|${REPO}|g" \
              -e "s|@VERSION@|${VERSION}|g" \
              -e "s|@SHA256@|${SHA256}|g" \
              packaging/aur/atk-control/PKGBUILD.in \
              > packaging/aur/atk-control/PKGBUILD
      - name: Publish atk-control
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: atk-control
          pkgbuild: packaging/aur/atk-control/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "atk-control ${{ needs.source.outputs.version }}"
          ssh_keyscan_types: ed25519,rsa,ecdsa
