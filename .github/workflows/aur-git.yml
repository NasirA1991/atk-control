name: Publish AUR (git)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aur-git
  cancel-in-progress: true

jobs:
  publish:
    if: vars.AUR_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Render PKGBUILD
        run: |
          sed "s|@REPO@|${{ github.repository }}|g" \
            packaging/aur/compx-control-git/PKGBUILD.in \
            > packaging/aur/compx-control-git/PKGBUILD

      - name: Publish compx-control-git
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: compx-control-git
          pkgbuild: packaging/aur/compx-control-git/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "compx-control-git: sync PKGBUILD from ${{ github.sha }}"
          allow_empty_commits: false
          ssh_keyscan_types: ed25519,rsa,ecdsa
