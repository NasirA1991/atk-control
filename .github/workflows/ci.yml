name: CI

on:
  push:
    branches: [main, operationvivaldi]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dbus python3-cairo python3-coverage appstream desktop-file-utils
      - name: Verify version sources agree
        run: python3 scripts/check_versions.py
      - name: Unit tests with coverage
        run: |
          python3 -m coverage run --source=atk_control -m unittest discover -s tests -v
          python3 -m coverage report -m --fail-under=40
      - name: CLI smoke test
        run: python3 -m atk_control.cli --help >/dev/null
      - name: Byte-compile
        run: python3 -m compileall -q atk_control
      - name: Validate AppStream metadata
        run: appstreamcli validate --no-net data/metainfo/io.github.atkcontrol.AtkControl.metainfo.xml
      - name: Validate desktop entry
        run: desktop-file-validate data/applications/io.github.atkcontrol.AtkControl.desktop

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install static-analysis tools
        run: python3 -m pip install "ruff==0.17.4" "mypy==2.4.1"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy atk_control

  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install GTK stack
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 python3-cairo python3-dbus xvfb dbus-x11
      - name: Start demo UI
        run: |
          set +e
          timeout 8 dbus-run-session -- xvfb-run -a -s '-screen 0 1200x1000x24' \
            env GSK_RENDERER=cairo python3 -m atk_control --demo --no-tray
          code=$?
          if [ "$code" -ne 124 ]; then
            echo "UI exited unexpectedly with $code" >&2
            exit 1
          fi
