app-id: io.github.compxcontrol.CompxControl
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: compx-control

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # The 0xff02:0002 vendor HID collection is a raw hidraw device.
  - --device=all
  # StatusNotifierItem tray (KDE and AppIndicator hosts).
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=io.github.compxcontrol.CompxControl.StatusNotifierItem
  - --talk-name=org.freedesktop.Notifications

modules:
  # The GNOME runtime ships Python 3, PyGObject, GTK4, libadwaita and pycairo,
  # but not dbus-python, which the StatusNotifierItem tray needs.
  - name: dbus-python
    buildsystem: meson
    config-opts:
      - -Dtests=disabled
      - -Ddoc=disabled
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/f3/cc/23f24bc7cbfec3a0ab508b7e11bc98837d77a91445d5f666a8545353a147/dbus_python-1.5.1.tar.gz
        sha256: 57423cf87d09b7d084f420b55b737fe654c33339b06df77945620d97795c6ac4

  - name: compx-control
    buildsystem: simple
    build-commands:
      - install -d /app/share/compx-control
      - cp -r compx_control data /app/share/compx-control/
      - find /app/share/compx-control -name __pycache__ -type d -prune -exec rm -rf {} +
      - install -Dm755 packaging/flatpak/compx-control.sh /app/bin/compx-control
      - install -Dm755 packaging/flatpak/compxctl /app/bin/compxctl
      - install -Dm644 packaging/flatpak/launcher.py /app/share/compx-control/launcher.py
      - install -Dm644 data/applications/io.github.compxcontrol.CompxControl.desktop /app/share/applications/io.github.compxcontrol.CompxControl.desktop
      - install -Dm644 data/metainfo/io.github.compxcontrol.CompxControl.metainfo.xml /app/share/metainfo/io.github.compxcontrol.CompxControl.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/compx-control.svg /app/share/icons/hicolor/scalable/apps/compx-control.svg
      - install -Dm644 data/icons/hicolor/scalable/apps/compx-control.svg /app/share/icons/hicolor/scalable/apps/io.github.compxcontrol.CompxControl.svg
      - install -Dm644 data/icons/hicolor/256x256/apps/compx-control.png /app/share/icons/hicolor/256x256/apps/compx-control.png
    sources:
      - type: dir
        path: ../..
